
{{ with .Params.tags }}
  <ul class="tags__list">
    {{ range . }}
      {{ with $.Site.GetPage (printf "tags/%s" .) }}
      <li class="tag__item">
        <a class="tag__link" href="{{ .RelPermalink }}"
          >{{ .Title | humanize }}</a
        >
      </li>
      {{ end }}
    {{ end }}
  </ul>
{{ end }}
